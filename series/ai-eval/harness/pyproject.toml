[project]
name = "harness"
version = "0.1.0"
description = "AI Eval Labs system under test: a research assistant agent over a public-domain corpus"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.50",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: calls a real model (Ollama or hosted); skipped by default"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
