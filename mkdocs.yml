site_description: "Hands-on builds in AI: code, demos, and write-ups"
repo_url: https://github.com/markroxai/labs.markrox.ai
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}
